apiVersion: v1
kind: Service
metadata:
  name: user-api-svc
  namespace: user-api
spec:
  selector:
    app: user-api
  ports:
    - port: 80
      targetPort: 8090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: user-db-svc
  namespace: user-api
spec:
  selector:
    app: user-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
