version: "3.9"

services:
  api:
    build: .
    container_name: user-api
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: "host=db user=user password=password dbname=usersdb port=5432 sslmode=disable"
      GIN_MODE: debug
      PORT: "8090"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: usersdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d usersdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
