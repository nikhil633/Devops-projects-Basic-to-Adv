apiVersion: v1
kind: Service
metadata:
  name: product-api-svc
  namespace: product-api
spec:
  selector:
    app: product-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: product-db-svc
  namespace: product-api
spec:
  selector:
    app: product-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
