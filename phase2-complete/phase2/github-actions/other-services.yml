# github-actions/nodejs-notification.yml
name: nodejs-notification
on:
  push:
    branches: [main, "release/**"]
    paths: ["nodejs-notification/**"]
  workflow_dispatch:
jobs:
  pipeline:
    uses: ./.github/workflows/reusable-service-pipeline.yml
    with:
      service: nodejs-notification
      context: nodejs-notification
      dockerfile: phase2/dockerfiles/nodejs/Dockerfile
      port: "3000"
    secrets: inherit
---
