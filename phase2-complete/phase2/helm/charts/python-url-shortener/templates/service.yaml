{{/* helm/charts/python-url-shortener/templates/service.yaml */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "python-url-shortener.fullname" . }}
  labels:
    {{- include "python-url-shortener.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "python-url-shortener.selectorLabels" . | nindent 4 }}
