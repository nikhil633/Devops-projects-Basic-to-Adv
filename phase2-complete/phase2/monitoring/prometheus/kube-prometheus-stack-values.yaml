# monitoring/prometheus/kube-prometheus-stack-values.yaml
#
# Install with:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --values monitoring/prometheus/kube-prometheus-stack-values.yaml
#
# This single Helm chart installs:
#   - Prometheus Operator (manages Prometheus via CRDs)
#   - Prometheus (time-series metrics database)
#   - Alertmanager (routes alerts to Slack/PagerDuty)
#   - Grafana (dashboards)
#   - kube-state-metrics (cluster-level metrics)
#   - node-exporter (per-node OS metrics)

# ── Prometheus ─────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: "40GB"

    # Scrape ServiceMonitors from ALL namespaces (not just monitoring)
    # This is how Prometheus discovers your app's /metrics endpoints
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Additional scrape configs for services that don't have ServiceMonitors
    additionalScrapeConfigs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

# ── Alertmanager ────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    retention: 120h

  config:
    global:
      resolve_timeout: 5m
      slack_api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"  # replace

    route:
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: slack-notifications

      routes:
        # Critical alerts go to PagerDuty
        - match:
            severity: critical
          receiver: pagerduty
          continue: true

        # Everything goes to Slack
        - match_re:
            severity: "warning|critical"
          receiver: slack-notifications

    receivers:
      - name: slack-notifications
        slack_configs:
          - channel: "#devops-alerts"
            send_resolved: true
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
            text: >-
              {{ range .Alerts -}}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Namespace:* {{ .Labels.namespace }}
              *Service:* {{ .Labels.service }}
              {{ end }}

      - name: pagerduty
        pagerduty_configs:
          - routing_key: "YOUR_PAGERDUTY_INTEGRATION_KEY"  # replace
            send_resolved: true

    inhibit_rules:
      # Suppress warnings when critical is already firing for the same service
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ["alertname", "namespace", "service"]

# ── Grafana ─────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "changeme123"   # use a secret in production

  persistence:
    enabled: true
    size: 10Gi

  # Load dashboards from ConfigMaps automatically
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL   # look for dashboard ConfigMaps in all namespaces
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true

  grafana.ini:
    server:
      root_url: "https://grafana.example.com"   # replace
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.example.com
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.example.com

# ── kube-state-metrics (cluster metrics) ─────────────────────────────────
kube-state-metrics:
  enabled: true

# ── node-exporter (per-node OS metrics: CPU, memory, disk, network) ──────
nodeExporter:
  enabled: true

# ── Default PrometheusRules (pre-built alert rules) ──────────────────────
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false          # managed EKS/AKS don't expose etcd
    kubeScheduler: false # managed clusters don't expose scheduler
    kubeControllerManager: false
    node: true
    kubeApiserver: true
    kubelet: true
    kubeProxy: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    general: true
    prometheusOperator: true
