[package]
name = "rate-limiter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rate-limiter"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = "0.3"
