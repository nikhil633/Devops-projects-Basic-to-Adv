---
# playbooks/patch_and_reboot.yml
#
# Daily/weekly patching run: update packages, reboot only if the kernel
# actually changed, and do it host-by-host so you don't take a whole
# tier down at once.
#
# Usage:
#   ansible-playbook playbooks/patch_and_reboot.yml -i inventory/hosts.ini -l web
#   ansible-playbook playbooks/patch_and_reboot.yml --check          # dry run
#   ansible-playbook playbooks/patch_and_reboot.yml -e "reboot_ok=false"

- name: Patch systems and reboot only when required
  hosts: all
  become: true
  serial: "25%"          # roll through the fleet in batches, not all at once
  vars:
    reboot_ok: true
    reboot_timeout: 600

  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Upgrade all packages (Debian/Ubuntu)
      apt:
        upgrade: dist
        autoremove: true
      register: apt_result
      when: ansible_os_family == "Debian"

    - name: Upgrade all packages (RHEL/CentOS/Rocky)
      dnf:
        name: "*"
        state: latest
      register: dnf_result
      when: ansible_os_family == "RedHat"

    - name: Check if a reboot is required (Debian/Ubuntu)
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_os_family == "Debian"

    - name: Check if a reboot is required (RHEL family)
      command: needs-restarting -r
      register: needs_restart
      failed_when: false
      changed_when: false
      when: ansible_os_family == "RedHat"

    - name: Set reboot fact
      set_fact:
        needs_reboot: >-
          {{
            (reboot_required_file.stat.exists | default(false))
            or (needs_restart.rc | default(0) == 1)
          }}

    - name: Reboot and wait for the host to come back
      reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        msg: "Rebooting for patch updates via Ansible"
      when: needs_reboot and reboot_ok

    - name: Report hosts still pending manual reboot
      debug:
        msg: "{{ inventory_hostname }} needs a reboot but reboot_ok=false — schedule manually."
      when: needs_reboot and not reboot_ok
