# dockerfiles/react/nginx.conf
# Production Nginx config for React SPA

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    # ── Gzip compression ──────────────────────────────────
    # Reduces JS/CSS bundle sizes by 60-80% over the wire
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Static asset caching ──────────────────────────────
    # React's build output uses content-hashed filenames (main.a1b2c3.js).
    # These can be cached forever — when content changes, filename changes.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # ── React Router SPA support ──────────────────────────
    # try_files checks if a file exists on disk.
    # If not (e.g. /dashboard/settings), serve index.html.
    # React Router then handles routing client-side.
    location / {
        try_files $uri $uri/ /index.html;

        # Don't cache index.html — it references the hashed bundles
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Health check endpoint ─────────────────────────────
    # Kubernetes liveness probe hits this — no React involved
    location /health {
        access_log  off;
        return      200 "ok\n";
        add_header  Content-Type text/plain;
    }
}
